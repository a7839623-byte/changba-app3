name: Build Android Kotlin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出 GitHub 倉庫中的程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設定 Java 環境 (原生 Android 必須的 JDK 17 編譯環境)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # 自動快取，第二次打包只要 1 分鐘

      # 3. 核心防爆黑魔法：直接在雲端「無中生有」生出完美的 gradlew 執行檔
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.1.1

      # 4. 賦予剛生成的 gradlew 實體執行權限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 執行原生 Android 打包指令（編譯最乾淨、最穩定的 Debug 版本 APK）
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. 將打包生成的 APK 檔案上傳到 GitHub Artifacts 產物區
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: changba-assistant-kotlin-apk
          path: app/build/outputs/apk/debug/*.apk
